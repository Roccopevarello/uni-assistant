# Each function checks who is calling itself (signed-in student, scheduler
# secret, or the private calendar token), so the gateway JWT check is off.
[functions.save-settings]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.oauth-start]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.oauth-callback]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.daily-check]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.calendar]
verify_jwt = false
import_map = "./functions/deno.json"
